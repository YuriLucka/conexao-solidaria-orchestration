# API Gateway: Kong DB-less. Entrada única em http://localhost:8000 (site em /, API em /api, Scalar em /scalar).
# A configuração vem do ConfigMap kong-config, gerado pelo scripts/up.sh a partir de kong/kong.yml com o segredo do JWT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: conexao-solidaria
  labels:
    app: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.9
          ports:
            - { name: proxy, containerPort: 8000 }
            - { name: status, containerPort: 8100 }
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: /kong/declarative/kong.yml }
            - { name: KONG_PROXY_LISTEN, value: "0.0.0.0:8000" }
            - { name: KONG_ADMIN_LISTEN, value: "127.0.0.1:8001" }
            # /status e /metrics (plugin prometheus) para o Prometheus.
            - { name: KONG_STATUS_LISTEN, value: "0.0.0.0:8100" }
            # Um worker do nginx basta aqui e economiza memória (o padrão é um por CPU).
            - { name: KONG_NGINX_WORKER_PROCESSES, value: "1" }
          volumeMounts:
            - name: config
              mountPath: /kong/declarative
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet: { path: /status/ready, port: status }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: status }
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: conexao-solidaria
  labels:
    app: kong
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - { name: proxy, port: 8000, targetPort: proxy, nodePort: 30800 }
    - { name: status, port: 8100, targetPort: status }
