# Cluster local de um nó. As portas NodePort dos serviços de entrada ficam publicadas no localhost:
#   8000 Kong (site, API, Scalar) · 15672 RabbitMQ · 3000 Grafana · 8081 Zabbix · 9090 Prometheus
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: conexao-solidaria
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30800, hostPort: 8000, protocol: TCP }
      - { containerPort: 31567, hostPort: 15672, protocol: TCP }
      - { containerPort: 30300, hostPort: 3000, protocol: TCP }
      - { containerPort: 30081, hostPort: 8081, protocol: TCP }
      - { containerPort: 30909, hostPort: 9090, protocol: TCP }
