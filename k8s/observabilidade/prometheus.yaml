# Prometheus: coleta /metrics da API, do worker, do Kong e do RabbitMQ a cada 5 s. Interface em http://localhost:9090.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: conexao-solidaria
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: campanhas-api
        static_configs:
          - targets: ["campanhas-api:8080"]
      - job_name: doacoes-worker
        static_configs:
          - targets: ["doacoes-worker:8080"]
      - job_name: kong
        static_configs:
          - targets: ["kong:8100"]
      # Métricas por fila (mensagens prontas e em processamento na doacao-recebida).
      - job_name: rabbitmq
        metrics_path: /metrics/detailed
        params:
          family: ["queue_coarse_metrics", "queue_consumer_count"]
        static_configs:
          - targets: ["rabbitmq:15692"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: conexao-solidaria
  labels:
    app: prometheus
spec:
  # Uma réplica: com várias atrás de um Service, cada uma teria uma parte dos dados.
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # Muda quando o ConfigMap muda (scripts/up.sh), forçando o pod a reler a configuração.
        conexao-solidaria/config: "1"
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - { name: http, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: dados, mountPath: /prometheus }
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: dados
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: conexao-solidaria
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - { name: http, port: 9090, targetPort: http, nodePort: 30909 }
